<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/pages-catalog.css" />

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="3e409a77-ee3e-45a9-bd00-c10059881d24"
    ></script>

    <title>Прикраси про кіно</title>
  </head>
  <body>
    <div class="go-prev-page-button-container">
      <div class="go-prev-page-button-wrapper">
        <button type="button" id="go-prev-page-button">
          <img src="../assets/images/pages/shared/left-arrow.svg" alt="←" />
          назад
        </button>
      </div>
    </div>
    <header>
      <div class="container">
        <div class="catalog-heading">
          <h1>Прикраси про кіно</h1>
        </div>
      </div>
    </header>
    <main>
      <nav class="container">
        <ul id="catalog-list"></ul>
      </nav>
    </main>
    <script>
      document
        .getElementById('go-prev-page-button')
        .addEventListener('click', function () {
          window.history.back();
        });

      const data = [

      {
          imgSrc: '../assets/images/pages/movie theme/Harry Potter.JPG',
          imgAlt: 'Намисто натхненне улюбленим дитячим фільмом',
          catalogItems: [
            {
              name: 'Гаррі Поттер',
              price: 1760
            }
          ],
          href: 'https://www.instagram.com/p/DGC6gfUNdTg/?img_index=1'
        }, 
        {
          imgSrc: '../assets/images/pages/movie theme/friends.jpg',
          imgAlt: 'Намисто натхненне серіалом ДРУЗІ',
          catalogItems: [
            {
              name: 'Friends',
              price: 1850,
              length: 'намисто 38-42 см'
            }
          ],
          href: 'https://www.instagram.com/p/DLmnz0ItrQM/?img_index=1'
        },
        {
          imgSrc: '../assets/images/pages/movie theme/stranger things.jpg',
          imgAlt: 'Намисто натхненне серіалом',
          catalogItems: [
            {
              name: 'Дивні дива',
              price: 2240,
              length: 'намисто 40-45 см'
            }
          ],
          href: 'https://www.instagram.com/p/DRgoh4vDT-i/?img_index=1'
        },
        {
          imgSrc: '../assets/images/pages/movie theme/stranger things bracelet.jpg',
          imgAlt: 'Браслети натхненні серіалом',
          catalogItems: [
            {
              name: 'браслет',
              price: 1280,
              length: '4 кулони'
            },
            {
              name: 'браслет',
              price: 1430,
              length: '5 кулонів'
            }
          ],
          href: 'https://www.instagram.com/p/DTCzZnWjZY9/?img_index=1'
        },
        {
          imgSrc: '../assets/images/pages/movie theme/pomegranate color.JPG',
          imgAlt: 'Намисто натхненне фільмом КОЛІР ГРАНАТУ',
          catalogItems: [
            {
              name: 'Колір гранату',
              price: 1610
            }
          ],
          href: 'https://www.instagram.com/p/DAV7E53tCMg/?img_index=1'
        },
        {
          imgSrc: '../assets/images/pages/movie theme/Shrek.jpeg',
          imgAlt: 'Намисто для Фіони',
          catalogItems: [
            {
              name: 'Шрек (літера)',
              price: 1450
            }
          ],
          href: 'https://www.instagram.com/p/C6_B6vztnBX/?img_index=1'
        },
        {
          imgSrc: '../assets/images/pages/movie theme/Shrek_face.jpeg',
          imgAlt: 'Намисто для Фіони',
          catalogItems: [
            {
              name: 'Шрек (личко)',
              price: 1500
            }
          ],
          href: 'https://www.instagram.com/p/C6_B6vztnBX/?img_index=1'
        },
        
      ];

      const catalogList = document.getElementById('catalog-list');

      data.forEach((item) => {
        const li = document.createElement('li');
        li.classList.add('catalog-item');

        // Catalog item image
        const img = document.createElement('img');
        img.classList.add('catalog-item-image');
        img.setAttribute('loading', 'lazy');
        img.setAttribute('src', item.imgSrc);
        img.setAttribute('alt', item.imgAlt);
        li.appendChild(img);

        // Catalog item information
        item.catalogItems.forEach((catalogItem) => {
          const catalogItemDiv = document.createElement('div');
          catalogItemDiv.classList.add('catalog-item-short-info');

          const h2 = document.createElement('h2');
          h2.textContent = catalogItem.name;
          catalogItemDiv.appendChild(h2);

          const b = document.createElement('b');
          b.innerHTML = `${catalogItem.price}<span class="currency-uah">грн</span>`;
          catalogItemDiv.appendChild(b);

          const p = document.createElement('p');
          p.textContent = catalogItem.length;
          catalogItemDiv.appendChild(p);

          li.appendChild(catalogItemDiv);
        });

        // Catalog item details link
        const detailsLink = document.createElement('a');
        detailsLink.classList.add('catalog-item-details');
        detailsLink.setAttribute('href', item.href);
        detailsLink.setAttribute('target', '_blank'); // Opens the link in a new tab
        detailsLink.setAttribute('rel', 'noopener noreferrer'); // Improves security
        detailsLink.textContent = 'детальніше';
        li.appendChild(detailsLink);

        catalogList.appendChild(li);
      });
    </script>
  </body>
</html>
